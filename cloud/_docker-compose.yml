    # ports:
    #   - "${HERMES_PORT_PREFIX}07:9980/tcp"

networks:
  hermes-net-weagle:
    name: hermes-net-weagle
    driver: bridge
    external: true
  hermes-net-model-cloud:
    name: hermes-net-model-cloud
    driver: bridge
    external: true
