  # Nextcloud
services:
  hermes-cloud-nextcloud:
    image: nextcloud
    hostname: ${HERMES_HOSTNAME}
    container_name: hermes-cloud-nextcloud
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cloud.rule=Host(`${HERMES_HOSTNAME}`) && PathPrefix(`/cloud`)"
      - "traefik.http.routers.cloud.entrypoints=websecure"
      - "traefik.http.routers.cloud.tls=true"
      - "traefik.http.routers.cloud.service=cloud"
      - "traefik.http.middlewares.strippathcloud.stripprefix.prefixes=/cloud"
      - "traefik.http.routers.cloud.middlewares=strippathcloud@docker"
      - "traefik.http.services.cloud.loadbalancer.server.port=80"
    networks: 
      - hermes-net-weagle
      - hermes-net-model-cloud
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - "./data/cloud/html:/var/www/html"
      - "./data/cloud/custom_apps:/var/www/html/custom_apps"
      - "./data/cloud/config:/var/www/html/config"
      - "./data/cloud/data:/var/www/html/data"
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      TRUSTED_PROXIES: "${HERMES_INGRESS_SUBNET}"
      OVERWRITEPROTOCOL: "https"
      OVERWRITEHOST: "${HERMES_HOSTNAME}"
      OVERWRITEWEBROOT: "${HERMES_CLOUD_BASEPATH}"
      # NEXTCLOUD_INIT_HTACCESS: true
      MYSQL_DATABASE: "${HERMES_CLOUD_DB_NAME}"
      MYSQL_USER: "${HERMES_CLOUD_DB_USER}"
      MYSQL_PASSWORD: "${HERMES_CLOUD_DB_PASS}"
      MYSQL_HOST: "${HERMES_CLOUD_DB_HOST}"
      REDIS_HOST: "${HERMES_CLOUD_DB_REDIS}"
      OBJECTSTORE_S3_BUCKET: "${HERMES_CLOUD_S3_BUCKET}"
      # OBJECTSTORE_S3_HOST: "${HERMES_CLOUD_S3_HOST}"
      OBJECTSTORE_S3_REGION: "${HERMES_CLOUD_S3_REGION}"
      OBJECTSTORE_S3_KEY: "${HERMES_CLOUD_S3_KEY}"
      OBJECTSTORE_S3_SECRET: "${HERMES_CLOUD_S3_SECRET}"
      OBJECTSTORE_S3_AUTOCREATE: true
    dns:
        - ${HERMES_DNS_RESOLVER}
        - 1.1.1.1
        - 8.8.8.8
    # traefik ignores ports,
    # keep it for k8s/helm charts only. 
    # ports:
    #   - "${HERMES_PORT_PREFIX}04:80/tcp"
    #   - "${HERMES_PORT_PREFIX}05:443/tcp"
    #   - "${HERMES_PORT_PREFIX}06:8080/tcp"

  # hermes-cloud-collabora:
