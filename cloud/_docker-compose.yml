  # Nextcloud
services:
  nextcloud:
    image: nextcloud:fpm
    container_name: nextcloud
    restart: unless-stopped
    networks: 
      - hermes-weagle
    depends_on:
      - mariadb
      - redis
    volumes:
      - ./data/cloud/html:/var/www/html
      - ./data/cloud/custom_apps:/var/www/html/custom_apps
      - ./data/cloud/config:/var/www/html/config
      - ./data/cloud/data:/var/www/html/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - OVERWRITEWEBROOT="/${HERMES_SUBPATH}"
      - TRUSTEDPROXIES="${HERMES_DNS_SUBNET}" # csv, please add your docker network mask
      - MYSQL_DATABASE=${HERMES_CLOUD_DB_NAME}
      - MYSQL_USER=${HERMES_CLOUD_DB_USER}
      - MYSQL_PASSWORD=${HERMES_CLOUD_DB_PASS}
      - MYSQL_HOST=${HERMES_CLOUD_DB_HOST}
      - REDIS_HOST=${HERMES_CLOUD_DB_REDIS}
      - OBJECTSTORE_S3_BUCKET=${HERMES_CLOUD_S3_BUCKET}
      - OBJECTSTORE_S3_REGION=${HERMES_CLOUD_S3_REGION}
      - OBJECTSTORE_S3_KEY=${HERMES_CLOUD_S3_KEY}
      - OBJECTSTORE_S3_SECRET=${HERMES_CLOUD_S3_SECRET}

  # split to data lib later
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    networks:
      - hermes-weagle
    dns:
      - ${HERMES_DNS_RESOLVER}

  mariadb:
    image: mariadb
    container_name: mariadb
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    networks: 
      - hermes-weagle
    volumes:
      - ./data/db:/var/lib/mysql
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_PASSWORD=${HERMES_CLOUD_DB_PASS}
      - MYSQL_DATABASE=${HERMES_CLOUD_DB_NAME}
      - MYSQL_USER=${HERMES_CLOUD_DB_NAME}
    dns:
      - ${HERMES_DNS_RESOLVER}

  # split to office lib later
  collabora:
    image: collabora/code
    container_name: collabora
    restart: unless-stopped
    networks:
      - hermes-weagle
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - password=${HERMES_CLOUD_OFFICE_PASS}
      - username=${HERMES_CLOUD_OFFICE_USER}
      - domain=${HERMES_CLOUD_HOSTNAME}
      - extra_params=--o:ssl.enable=true
    ports:
      - 9980:9980
    dns:
      - ${HERMES_DNS_RESOLVER}

networks:
  weagle:
    name: weagle
    driver: bridge
    external: true
