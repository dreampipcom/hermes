# hermes/ingress/snakeoiltls/cluster(local)
services:
  hermes_weagle:
    image: docker.io/traefik:latest #v2.5
    container_name: traefik
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    networks:
      hermes_weagle:
        ipv4_address: ${HERMES_DNS_RESOLVER}
      hermes_cloud:
      hermes_cloud:
    labels:
      - "traefik.http.routers.traefik.rule=PathPrefix(`/`)`)"
      - "traefik.http.routers.traefik.service=api@internal"
    volumes:
      - "./data/traefik/${HERMES_CERT_FILE}:/certs/${HERMES_CERT_FILE}"
      - "./data/traefik/${HERMES_CERT_KEY_FILE}:/certs/${HERMES_CERT_KEY_FILE}"
      - "./traefik.yml:/etc/traefik/traefik.yml"
      - "./dynamic.yml:/etc/traefik/dynamic.yml"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    dns:
      - ${HERMES_DNS_RESOLVER}
  
  whoami:
    image: traefik/whoami
    container_name: whoami

  grafana:
    image: grafana/grafana-oss
    container_name: grafana
    networks:
      - hermes_weagle
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${HERMES_GRAFANA_SECURITY_ADMIN_PASS}
      GF_SERVER_DOMAIN: ${HERMES_HOSTNAME}
      GF_SERVER_ROOT_URL: https://${HERMES_HOSTNAME}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: 'true'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=PathPrefix(`/_sre/graf`)"
      - "traefik.http.routers.grafana.tls=${HERMES_TLS}"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.docker.network=weagle"
    dns:
      - ${HERMES_DNS_RESOLVER}

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
      - ${HERMES_PROM_VOLUME}:/etc/prometheus/prometheus
    networks:
      - hermes_weagle
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.size=768MB"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=PathPrefix(`/_sre/prom`)"
      - "traefik.http.routers.prometheus.tls=${HERMES_TLS}"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "traefik.docker.network=weagle"
    dns:
      - ${HERMES_DNS_RESOLVER}

  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    networks:
      - hermes_weagle
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nodeexporter.rule=PathPrefix(`/_sre/prom/node`)"
      - "traefik.http.routers.nodeexporter.tls=${HERMES_TLS}"
      - "traefik.http.services.nodeexporter.loadbalancer.server.port=9100"
      - "traefik.docker.network=weagle"
    dns:
      - ${HERMES_DNS_RESOLVER}
  
  alert-manager:
    image: prom/alertmanager
    container_name: alert-manager
    volumes:
      - "./alertmanager.yml:/alertmanager/alertmanager.yml"
    networks:
      - hermes_weagle
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.alertmanager.rule=PathPrefix(`/_sre/prom/alerts`)"
      - "traefik.http.routers.alertmanager.tls=${HERMES_TLS}"
      - "traefik.http.services.alertmanager.loadbalancer.server.port=9093"
      - "traefik.docker.network=weagle"
    dns:
      - ${HERMES_DNS_RESOLVER}

networks:
  hermes_weagle:
    name: hermes_weagle
    driver: bridge
    external: true
  hermes_chat:
    name: hermes_chat
    driver: bridge
    external: true
  hermes_cloud:
    name: hermes_cloud
    driver: bridge
    external: true
  # radio:
  #   name: radio
  #   driver: bridge
  #   external: true