# hermes/ingress/manualtls/cluster(prod)
services:
  hermes-ingress-traefik:
    image: docker.io/traefik:latest
    container_name: hermes-ingress-traefik
    restart: always
    ports:
      # web
      - "80:80"
      - "443:443"
      # mail
      - "25:25"
      - "587:587"
      - "465:465"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
      - "4190:4190"
      # - "8080:8080"
      # - target: 80
      #   published: 80
      #   mode: host
      # - target: 443
      #   published: 443
      #   mode: host
    networks:
      hermes-net-weagle:
          ipv4_address: ${HERMES_DNS_RESOLVER}
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - "../certs/data:/etc/certs/"
      - "./data/acme.json:acme.json"
      - "./data:/data"
      - "./traefik.yml:/etc/traefik/traefik.yml"
      # - "./dynamic.yml:/etc/traefik/dynamic.yml"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    # labels:
    #     - "traefik.http.routers.traefik.rule=Host(`${HERMES_HOSTNAME}`) && PathPrefix(`/_sre/dashboard`)"
    #     - "traefik.http.routers.traefik.entrypoints=websecure"
    #     - "traefik.http.routers.traefik.tls=true"
    #     - "traefik.http.routers.traefik.service=traefik"
    #     - "traefik.http.services.traefik.loadbalancer.server.port=8080"

  hermes-ingress-whoami:
    image: traefik/whoami
    container_name: hermes-ingress-whoami
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`${HERMES_HOSTNAME}`) && PathPrefix(`/_sre/whoami`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.tls=true"
      - "traefik.http.routers.whoami.service=whoami"
      - "traefik.http.routers.whoami.tls.certResolver=le-ssl"
      - "traefik.http.services.whoami.loadbalancer.server.port=80"
    networks:
      - hermes-net-weagle
    # environment:
    #   WHOAMI_PORT_NUMBER: 1423
    # traefik ignores ports,
    # keep it for k8s/helm charts only. 
    # ports:
    #   - "${HERMES_PORT_PREFIX}99:1423/tcp"
    dns:
      - ${HERMES_DNS_RESOLVER}

