# hermes/ingress/manualtls/cluster(prod)
services:
  hermes-ingress-traefik:
    image: docker.io/traefik:latest
    container_name: hermes-ingress-traefik
    restart: always
    ports:
      # - "80:80"
      # - "443:443"
      # - "8080:8080"
      - target: 80
        published: 80
        mode: host
      - target: 443
        published: 443
        mode: host
      - target: 8080
        published: 8080
        mode: host
    networks:
      hermes-net-weagle:
          ipv4_address: ${HERMES_DNS_RESOLVER}
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - "--providers.docker"
    volumes:
      - "../certs/data:/etc/certs/"
      - "./data:/data"
      - "./traefik.yml:/etc/traefik/traefik.yml"
      - "./dynamic.yml:/etc/traefik/dynamic.yml"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  hermes-ingress-whoami:
    image: traefik/whoami
    container_name: hermes-ingress-whoami
    restart: always
    labels:
      - "traefik.enable=true"
    environment:
      WHOAMI_PORT_NUMBER: 1423
    # traefik ignores ports,
    # keep it for k8s/helm charts only. 
    ports:
      - "${HERMES_PORT_PREFIX}99:1423/tcp"

  hermes-ingress-grafana:
    image: grafana/grafana-oss
    container_name: hermes-ingress-grafana
    restart: always
    labels:
      - "traefik.enable=true"
    networks:
      - hermes-net-weagle
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${HERMES_GRAFANA_SECURITY_ADMIN_PASS}
      GF_SERVER_DOMAIN: ${HERMES_HOSTNAME}
      GF_SERVER_ROOT_URL: https://${HERMES_HOSTNAME}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: 'true'
    dns:
      - ${HERMES_DNS_RESOLVER}
    # traefik ignores ports,
    # keep it for k8s/helm charts only. 
    # ports:
    #   - "${HERMES_PORT_PREFIX}08:3000/tcp"

  hermes-ingress-prometheus:
    image: prom/prometheus
    container_name: hermes-ingress-prometheus
    restart: always
    labels:
      - "traefik.enable=true"
    volumes:
      - "./prometheus.yml:/etc/prometheus/prometheus.yml"
      - "${HERMES_PROM_VOLUME}:/etc/prometheus/prometheus"
    networks:
      - hermes-net-weagle
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.size=768MB"
    dns:
      - ${HERMES_DNS_RESOLVER}
    # traefik ignores ports,
    # keep it for k8s/helm charts only. 
    ports:
      - "${HERMES_PORT_PREFIX}09:9090/tcp"

  hermes-ingress-node-exporter:
    image: prom/node-exporter
    container_name: hermes-ingress-node-exporter
    restart: always
    networks:
      - hermes-net-weagle
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
    dns:
      - ${HERMES_DNS_RESOLVER}
    # traefik ignores ports,
    # keep it for k8s/helm charts only. 
    ports:
      - "${HERMES_PORT_PREFIX}10:9100/tcp"
  
  hermes-ingress-alert-manager:
    image: prom/alertmanager
    container_name: hermes-ingress-alert-manager
    restart: always
    volumes:
      - "./alertmanager.yml:/alertmanager/alertmanager.yml"
    networks:
      - hermes-net-weagle
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "traefik.enable=true"
    dns:
      - ${HERMES_DNS_RESOLVER}
    # traefik ignores ports,
    # keep it for k8s/helm charts only. 
    ports:
      - "${HERMES_PORT_PREFIX}11:9093/tcp"

networks:
  hermes-net-weagle:
    name: hermes-net-weagle
    driver: bridge
    external: true
  hermes-net-chat:
    name: hermes-net-chat
    driver: bridge
    external: true
  hermes-net-cloud:
    name: hermes-net-cloud
    driver: bridge
    external: true
  # radio:
  #   name: hermes_net_radio
  #   driver: bridge
  #   external: true