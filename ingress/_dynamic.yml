# hermes/ingress/traefik/dynamic(fqdn)
http:
  services:
    p1423:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: hermes-ingress-whoami:1423
    p3000:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://localhost:3000
    p9090:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://localhost:9090
    p9100:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://localhost:9100

  routers:
    traefik:
      entryPoints: websecure
      rule: "Host(`${HERMES_HOSTNAME}`) && PathPrefix(`/_sre/dashboard`)"
      tls: true
      service: "api@internal"
    whoami:
      entryPoints: websecure
      rule: "Host(`${HERMES_HOSTNAME}`) && PathPrefix(`/_sre/whoami`)"
      tls: true
      service: "p1423"
    grafana:
      entryPoints: websecure
      rule: "Host(`${HERMES_HOSTNAME}`) && PathPrefix(`/_sre/grafana`)"
      tls: true
      service: "p3000"
    prometheus:
      entryPoints: websecure
      rule: "Host(`${HERMES_HOSTNAME}`) && PathPrefix(`/_sre/prometheus`)"
      tls: true
      service: "p9090"
    node-exporter:
      entryPoints: websecure
      rule: "Host(`${HERMES_HOSTNAME}`) && PathPrefix(`/_sre/node-exporter`)"
      tls: true
      service: "p9100"