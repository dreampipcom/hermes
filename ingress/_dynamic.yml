# hermes/ingress/traefik/dynamic(fqdn)
tls:
  options:
    default:
      sniStrict: true
  certificates:
    - certFile: /etc/certs/${HERMES_CERT_FILE}
      keyFile: /etc/certs/${HERMES_CERT_KEY_FILE}

entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: false
  websecure:
    address: :443

http:
  routers:
    traefik:
      rule: "PathPrefix(`/_sre/dashboard`)"
      service: "api@internal"
    grafana:
      rule: "PathPrefix(`/_sre/grafana`)"
      tls: true
      service: "grafana"
    prometheus:
      rule: "PathPrefix(`/_sre/prometheus`)"
      tls: true
      service: "prometheus"
    node-exporter:
      rule: "PathPrefix(`/_sre/node-exporter`)"
      tls: true
      service: "node-exporter"
  services:
    grafana:
      loadbalancer:
        server:
          port: 3000
    prometheus:
      loadbalancer:
        server:
          port: 9090
    node-exporter:
      loadbalancer:
        server:
          port: 9100
