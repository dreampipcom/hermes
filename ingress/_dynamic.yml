# hermes/ingress/traefik/dynamic(fqdn)
tls:
  options:
    default:
      sniStrict: true
  certificates:
    - certFile: /etc/certs/${HERMES_CERT_FILE}
      keyFile: /etc/certs/${HERMES_CERT_KEY_FILE}

entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: false
  websecure:
    address: :443
