# hermes/ingress/traefik/dynamic(fqdn)
tls:
  options:
    modern:
      minVersion: VersionTLS13
      curvePreferences:
        - "X25519"
        - "CurveP256"
        - "CurveP384"
    intermediate:
      minVersion: VersionTLS12
      curvePreferences:
        - "X25519"
        - "CurveP256"
        - "CurveP384"
      cipherSuites:
        - "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256"
        - "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
        - "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
        - "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
        - "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305"
        - "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305"
    default:
      sniStrict: true
  stores:
    default:
      defaultCertificate:
        certFile: "/etc/certs/${HERMES_CERT_FILE}"
        keyFile: "/etc/certs/${HERMES_CERT_KEY_FILE}"
  certificates:
    - certFile: "/etc/certs/${HERMES_CERT_FILE}"
      keyFile: "/etc/certs/${HERMES_CERT_KEY_FILE}"
      stores:
        - default

