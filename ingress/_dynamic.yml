# hermes/ingress/traefik/dynamic(fqdn)
# https://ssl-config.mozilla.org/#server=traefik&version=3.4.0&config=intermediate&guideline=5.6

tls:
  options:
    modern:
      minVersion: VersionTLS13
      curvePreferences:
        - "X25519"
        - "CurveP256"
        - "CurveP384"
    intermediate:
      minVersion: VersionTLS12
      curvePreferences:
        - "X25519"
        - "CurveP256"
        - "CurveP384"
      cipherSuites:
        - "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256"
        - "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"
        - "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
        - "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
        - "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305"
        - "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305"
    default:
      sniStrict: true
  stores:
    default:
      defaultCertificate:
        certFile: "/etc/certs/${HERMES_CERT_FILE}"
        keyFile: "/etc/certs/${HERMES_CERT_KEY_FILE}"
  certificates:
    - certFile: "/etc/certs/${HERMES_CERT_FILE}"
      keyFile: "/etc/certs/${HERMES_CERT_KEY_FILE}"
      stores:
        - default

http:
  middlewares:
    fn-https:
      scheme: "https"
    fn-hsts:
      headers:
        customResponseHeaders:
          Strict-Transport-Security: "max-age=63072000"

