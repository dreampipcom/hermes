# hermes/ingress/prom/config
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  body_size_limit: 15MB
  sample_limit: 1500
  target_limit: 30
  label_limit: 30
  label_name_length_limit: 200
  label_value_length_limit: 200

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# rule_files:
#   - "first_rules.yml"
#   - "second_rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]