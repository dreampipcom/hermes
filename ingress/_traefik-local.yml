# hermes/ingress/traefik/static
global:
  checkNewVersion: true

log:
  level: WARN

api:
  insecure: true
  dashboard: true

ping: {}

metrics:
  prometheus:
    buckets: 0.1,0.3,1.2,5.0

providers:
  docker:
    exposedByDefault: false
    watch: true
  file:
    fileName: /etc/traefik/traefik.yml
    watch: true

entryPoints:
  web:
    address: :80
    # http:
    #   redirections:
    #     entryPoint:
    #       to: websecure
    #       scheme: https
    #       permanent: false
  websecure:
    address: :443