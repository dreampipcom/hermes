# hermes/ingress/traefik/static
global:
  checkNewVersion: true

certificateResolvers:
  le-ssl:
    acme:
      caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      email: ${HERMES_ROOT_HANDLE}@${HERMES_MAIL_MAIN_HOSTNAME}
      storage: "/etc/traefik/acme/acme.json"
      dnsChallenge:
        provider: cloudflare
        resolvers: 1.1.1.1:53,1.0.0.1:53
        delayBeforeCheck: 10

# apps might not provide a valid certificate to Traefik.
# the user mostly needs to encrypt until Traefik.
# (no mTLS use-case in the roadmap).
serversTransport:
  insecureSkipVerify: true

log:
  level: DEBUG

accesslog: true

api:
  insecure: false
  dashboard: false

ping: {}

metrics:
  prometheus:
    buckets: 0.1,0.3,1.2,5.0

providers:
  docker:
    network: hermes-net-weagle
    exposedByDefault: false
    watch: true
  file:
    fileName: /etc/traefik/dynamic.yml
    watch: true

entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    asDefault: true
    address: :443
  smtp:
    address: :25
  submissions:
    address: :587
  imap:
    address: :143
  imaps:
    address: :993
  pop3:
    address: :110
  pop3s:
    address: :995
  sieve:
    address: :4190