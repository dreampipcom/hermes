# hermes/ingress/traefik/static
global:
  checkNewVersion: true

certificateResolvers:
  le-ssl:
    acme:
      caServer: "https://acme-staging-v02.api.letsencrypt.org/directory"
      email: ${HERMES_ROOT_HANDLE}@${HERMES_MAIL_MAIN_HOSTNAME}
      storage: "/etc/traefik/acme/acme.json"
      dnsChallenge:
        provider: cloudflare
        resolvers: 1.1.1.1:53,1.0.0.1:53
        delayBeforeCheck: 10

# apps might not provide a valid certificate to Traefik.
# the user mostly needs to encrypt until Traefik.
# (no mTLS use-case in the roadmap).
serversTransport:
  insecureSkipVerify: true

log:
  level: DEBUG

accesslog: true

api:
  insecure: false
  dashboard: true

ping: {}

# metrics:
#   prometheus:
#     buckets: 0.1,0.3,1.2,5.0

providers:
  docker:
    network: hermes-net-weagle
    exposedByDefault: false
    watch: true
  file:
    fileName: /etc/traefik/dynamic.yml
    watch: true

entryPoints:
  web:
    address: :80
    http:
      forwardedHeaders:
        trustedIPs: &cloudflareIPs
            # Cloudflare (last updated: 2025-02-03)
            - 173.245.48.0/20
            - 103.21.244.0/22
            - 103.22.200.0/22
            - 103.31.4.0/22
            - 141.101.64.0/18
            - 108.162.192.0/18
            - 190.93.240.0/20
            - 188.114.96.0/20
            - 197.234.240.0/22
            - 198.41.128.0/17
            - 162.158.0.0/15
            - 104.16.0.0/13
            - 104.24.0.0/14
            - 172.64.0.0/13
            - 131.0.72.0/22
            - 2400:cb00::/32
            - 2606:4700::/32
            - 2803:f800::/32
            - 2405:b500::/32
            - 2405:8100::/32
            - 2a06:98c0::/29
            - 2c0f:f248::/32
            # EOF
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    asDefault: true
    address: :443
    http:
      forwardedHeaders:
        trustedIPs: *cloudflareIPs
      tls:
        certResolver: letsencrypt # cf uses le
        domains:
          - main: ${HERMES_HOSTNAME}
            sans:
              - '*.${HERMES_HOSTNAME}'
  smtp:
    address: :25
  submissions:
    address: :587
  imap:
    address: :143
  imaps:
    address: :993
  pop3:
    address: :110
  pop3s:
    address: :995
  sieve:
    address: :4190