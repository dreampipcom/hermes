# hermes/ingress/traefik/static
global:
  checkNewVersion: true

tls:
  # options:
  #   default:
  #     sniStrict: true
  certificates:
    - certFile: /etc/certs/${HERMES_CERT_FILE}
      keyFile: /etc/certs/${HERMES_CERT_KEY_FILE}

log:
  level: DEBUG

accesslog: true

api:
  insecure: false
  dashboard: true

ping: {}

metrics:
  prometheus:
    buckets: 0.1,0.3,1.2,5.0

providers:
  docker:
    exposedByDefault: false
    watch: true
  file:
    fileName: /etc/traefik/dynamic.yml
    watch: true

entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: false
  websecure:
    address: :443