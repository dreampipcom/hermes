# hermes/mail
services:
  hermes-mail-postgres:
    image: postgres:16-alpine
    container_name: hermes-mail-postgres
    hostname: hermes-mail-postgres
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      POSTGRES_DB: ${HERMES_MAIL_METADATA_DB_NAME}
      POSTGRES_USER: ${HERMES_MAIL_METADATA_DB_USER}
      POSTGRES_PASSWORD: ${HERMES_MAIL_METADATA_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HERMES_MAIL_METADATA_DB_USER} -d ${HERMES_MAIL_METADATA_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  hermes-mail-stalwart:
    image: stalwartlabs/stalwart:v0.16
    container_name: hermes-mail-stalwart
    hostname: ${HERMES_MAIL_MAIN_HOSTNAME}
    restart: unless-stopped
    depends_on:
      hermes-mail-postgres:
        condition: service_healthy
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data/stalwart/etc:/etc/stalwart
      - ./data/stalwart/data:/var/lib/stalwart
      - /etc/localtime:/etc/localtime:ro
    environment:
      STALWART_HOSTNAME: ${HERMES_MAIL_MAIN_HOSTNAME}
      STALWART_PUBLIC_URL: ${HERMES_MAIL_SERVER_URL}
      STALWART_RECOVERY_ADMIN: ${HERMES_MAIL_ADMIN_USER}:${HERMES_MAIL_ADMIN_PASSWORD}
      TZ: UTC
    dns:
      - ${HERMES_DNS_RESOLVER}
    ports:
      - "${HERMES_PORT_PREFIX}12:25/tcp"
      - "${HERMES_PORT_PREFIX}13:587/tcp"
      - "${HERMES_PORT_PREFIX}14:465/tcp"
      - "${HERMES_PORT_PREFIX}15:143/tcp"
      - "${HERMES_PORT_PREFIX}16:993/tcp"
      - "${HERMES_PORT_PREFIX}17:110/tcp"
      - "${HERMES_PORT_PREFIX}18:995/tcp"
      - "${HERMES_PORT_PREFIX}19:8080/tcp"

  hermes-mail-bulwark:
    image: ghcr.io/bulwarkmail/webmail:1.6.7
    container_name: hermes-mail-bulwark
    hostname: ${HERMES_MAIL_WEBMAIL_HOSTNAME}
    restart: unless-stopped
    depends_on:
      - hermes-mail-stalwart
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data/bulwark/admin:/app/data/admin
      - ./data/bulwark/admin-state:/app/data/admin-state
      - ./data/bulwark/settings:/app/data/settings
      - /etc/localtime:/etc/localtime:ro
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      JMAP_SERVER_URL: ${HERMES_MAIL_SERVER_URL}
      STALWART_FEATURES: "true"
      SESSION_SECRET: ${HERMES_MAIL_WEBMAIL_SESSION_SECRET}
      APP_NAME: ${HERMES_MAIL_WEBMAIL_APP_NAME}
      APP_SHORT_NAME: ${HERMES_MAIL_WEBMAIL_SHORT_NAME}
      APP_DESCRIPTION: ${HERMES_MAIL_WEBMAIL_DESCRIPTION}
      LOGIN_COMPANY_NAME: ${HERMES_MAIL_WEBMAIL_COMPANY_NAME}
      LOGIN_WEBSITE_URL: ${HERMES_MAIL_WEBMAIL_WEBSITE_URL}
      ADMIN_CONFIG_DIR: /app/data/admin
      ADMIN_STATE_DIR: /app/data/admin-state
      SETTINGS_DATA_DIR: /app/data/settings
    dns:
      - ${HERMES_DNS_RESOLVER}
    ports:
      - "${HERMES_PORT_PREFIX}20:3000/tcp"

  hermes-mail-bulwark-proxy:
    image: nginx:1.27-alpine
    container_name: hermes-mail-bulwark-proxy
    restart: unless-stopped
    depends_on:
      - hermes-mail-bulwark
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./bulwark-client.nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hermes-net-weagle"
      - "traefik.http.routers.mail-client.rule=Host(`${HERMES_MAIL_MAIN_HOSTNAME}`) && (PathPrefix(`/client`) || PathPrefix(`/_next`) || PathPrefix(`/branding`) || Path(`/manifest.webmanifest`) || Path(`/sw.js`))"
      - "traefik.http.routers.mail-client.entrypoints=websecure"
      - "traefik.http.routers.mail-client.tls=true"
      - "traefik.http.routers.mail-client.tls.certResolver=le-ssl"
      - "traefik.http.routers.mail-client.service=mail-client"
      - "traefik.http.services.mail-client.loadbalancer.server.port=8080"
    networks:
      - default
      - hermes-net-weagle
    dns:
      - ${HERMES_DNS_RESOLVER}

networks:
  hermes-net-weagle:
    name: hermes-net-weagle
    driver: bridge
    external: true
