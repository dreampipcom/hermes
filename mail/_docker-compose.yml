# hermes/mail
services:
  hermes-mail-mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: hermes-mail-mailserver
    hostname: ${HERMES_HOSTNAME}
    restart: always
    labels:
      - "traefik.enable=true"
      # web client
      # - "traefik.http.routers.mail.rule=Host(`${HERMES_HOSTNAME}`) && PathPrefix(`/mail`)"
      # - "traefik.http.routers.mail.entrypoints=websecure"
      # - "traefik.http.routers.mail.tls=true"
      # - "traefik.http.routers.mail.service=mail"
      # - "traefik.http.middlewares.strippathmail.stripprefix.prefixes=/mail"
      # - "traefik.http.routers.mail.middlewares=strippathmail@docker"
      # - "traefik.http.services.mail.loadbalancer.server.port=80"

      # TCP: port layer 6 switch
      #- traefik.tcp.routers.mail-submissions.rule=HostSNI(`mail.example.com`)
      # - traefik.tcp.routers.mail-submissions.tls.passthrough=true
      - "traefik.tcp.routers.smtp.rule=HostSNI(`${HERMES_HOSTNAME}`)"
      - "traefik.tcp.routers.smtp.entrypoints=smtp"
      - "traefik.tcp.routers.smtp.service=smtp"
      # - "traefik.tcp.routers.smtp.tls.certresolver=le-ssl"
      - "traefik.tcp.routers.smtp.tls.passthrough=true"
      - "traefik.tcp.services.smtp.loadbalancer.server.port=25"
      - "traefik.tcp.services.smtp.loadbalancer.proxyProtocol.version=2"

      - "traefik.tcp.routers.submissions.rule=HostSNI(`${HERMES_HOSTNAME}`)"
      - "traefik.tcp.routers.submissions.entrypoints=submissions"
      # - "traefik.tcp.routers.submissions.tls.certresolver=le-ssl"
      - "traefik.tcp.routers.submissions.tls.passthrough=true"
      - "traefik.tcp.routers.submissions.service=submissions"
      - "traefik.tcp.services.submissions.loadbalancer.server.port=465"
      - "traefik.tcp.services.submissions.loadbalancer.proxyProtocol.version=2"

      - "traefik.tcp.routers.imap.rule=HostSNI(`${HERMES_HOSTNAME}`)"
      - "traefik.tcp.routers.imap.entrypoints=imap"
      # - "traefik.tcp.routers.imap.tls.certresolver=le-ssl"
      - "traefik.tcp.routers.imap.tls.passthrough=true"
      - "traefik.tcp.routers.imap.service=imaps"
      - "traefik.tcp.services.imap.loadbalancer.server.port=143"
      - "traefik.tcp.services.imap.loadbalancer.proxyProtocol.version=2"

      - "traefik.tcp.routers.imaps.rule=HostSNI(`${HERMES_HOSTNAME}`)"
      - "traefik.tcp.routers.imaps.entrypoints=imaps"
      # - "traefik.tcp.routers.imaps.tls.certresolver=le-ssl"
      - "traefik.tcp.routers.imaps.tls.passthrough=true"
      - "traefik.tcp.routers.imaps.service=imaps"
      - "traefik.tcp.services.imaps.loadbalancer.server.port=993"
      - "traefik.tcp.services.imaps.loadbalancer.proxyProtocol.version=2"

      - "traefik.tcp.routers.pop3.rule=HostSNI(`${HERMES_HOSTNAME}`)"
      - "traefik.tcp.routers.pop3.entrypoints=pop3"
      # - "traefik.tcp.routers.pop3.tls.certresolver=le-ssl"
      - "traefik.tcp.routers.pop3.tls.passthrough=true"
      - "traefik.tcp.routers.pop3.service=pop3"
      - "traefik.tcp.services.pop3.loadbalancer.server.port=110"
      - "traefik.tcp.services.pop3.loadbalancer.proxyProtocol.version=2"

      - "traefik.tcp.routers.pop3s.rule=HostSNI(`${HERMES_HOSTNAME}`)"
      - "traefik.tcp.routers.pop3s.entrypoints=pop3s"
      # - "traefik.tcp.routers.pop3s.tls.certresolver=le-ssl"
      - "traefik.tcp.routers.pop3s.tls.passthrough=true"
      - "traefik.tcp.routers.pop3s.service=pop3s"
      - "traefik.tcp.services.pop3s.loadbalancer.server.port=995"
      - "traefik.tcp.services.pop3s.loadbalancer.proxyProtocol.version=2"

      - "traefik.tcp.routers.sieve.rule=HostSNI(`${HERMES_HOSTNAME}`)"
      - "traefik.tcp.routers.sieve.entrypoints=sieve"
      # - "traefik.tcp.routers.sieve.tls.certresolver=le-ssl"
      - "traefik.tcp.routers.sieve.tls.passthrough=true"
      - "traefik.tcp.routers.sieve.service=sieve"
      - "traefik.tcp.services.sieve.loadbalancer.server.port=4190"
      - "traefik.tcp.services.sieve.loadbalancer.proxyProtocol.version=2"
    networks:
      - hermes-net-weagle
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ../certs/data/:/tmp/dms/custom-certs/:ro
      - ./data/dms/mail-data/:/var/mail/
      - ./data/dms/mail-state/:/var/mail-state/
      - ./data/dms/mail-logs/:/var/log/mail/
      - ./data/dms/config/:/tmp/docker-mailserver/
      - ./data/emailstorage:/var/mail/
      - /etc/localtime:/etc/localtime:ro
    environment:
      SSL_TYPE: ${HERMES_MAIL_CERT_TYPE}
      SSL_DOMAIN: ${HERMES_APEX}
      SSL_CERT_PATH: /tmp/dms/custom-certs/${HERMES_CERT_FILE}
      SSL_KEY_PATH: /tmp/dms/custom-certs/${HERMES_CERT_KEY_FILE}
      # ACCOUNT_PROVISIONER: LDAP
      # LDAP_SERVER_HOST: ldap://ldap
      # LDAP_SEARCH_BASE: ou=people,dc=localhost,dc=localdomain
      # LDAP_BIND_DN: cn=admin,dc=localhost,dc=localdomain
      # LDAP_BIND_PW: admin
      # LDAP_QUERY_FILTER_USER: (&(mail=%s)(mailEnabled=TRUE))
      # LDAP_QUERY_FILTER_GROUP: (&(mailGroupMember=%s)(mailEnabled=TRUE))
      # LDAP_QUERY_FILTER_ALIAS: (|(&(mailAlias=%s)(objectClass=PostfixBookMailForward))(&(mailAlias=%s)(objectClass=PostfixBookMailAccount)(mailEnabled=TRUE)))
      # LDAP_QUERY_FILTER_DOMAIN: (|(&(mail=*@%s)(objectClass=PostfixBookMailAccount)(mailEnabled=TRUE))(&(mailGroupMember=*@%s)(objectClass=PostfixBookMailAccount)(mailEnabled=TRUE))(&(mailalias=*@%s)(objectClass=PostfixBookMailForward)))
      # DOVECOT_PASS_FILTER: (&(objectClass=PostfixBookMailAccount)(uniqueIdentifier=%n))
      # DOVECOT_USER_FILTER: (&(objectClass=PostfixBookMailAccount)(uniqueIdentifier=%n))
      # ENABLE_SASLAUTHD: 1
      # SASLAUTHD_MECHANISMS: ldap
      # SASLAUTHD_LDAP_SERVER: ldap
      # SASLAUTHD_LDAP_BIND_DN: cn=admin,dc=localhost,dc=localdomain
      # SASLAUTHD_LDAP_PASSWORD: admin
      # SASLAUTHD_LDAP_SEARCH_BASE: ou=people,dc=localhost,dc=localdomain
      # SASLAUTHD_LDAP_FILTER: (&(objectClass=PostfixBookMailAccount)(uniqueIdentifier=%U))
      # POSTMASTER_ADDRESS: postmaster@localhost.localdomain
    dns:
      - ${HERMES_DNS_RESOLVER}
    # traefik ignores ports,
    # keep it for k8s/helm charts only. 
    ports:
      - "${HERMES_PORT_PREFIX}12:25/tcp"
      - "${HERMES_PORT_PREFIX}13:465/tcp"
      - "${HERMES_PORT_PREFIX}14:995/tcp"
      - "${HERMES_PORT_PREFIX}15:993/tcp"

networks:
  hermes-net-weagle:
    name: hermes-net-weagle
    driver: bridge
    external: true