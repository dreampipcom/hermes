server {
    listen 8080;
    server_name _;
    # Docker embedded DNS for container-name resolution on the compose networks.
    resolver 127.0.0.11 ipv6=off valid=30s;
    set $bulwark_upstream hermes-mail-bulwark:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location = /client {
        return 302 /client/;
    }

    location /client/ {
        proxy_set_header X-Forwarded-Prefix /client;
        proxy_pass http://$bulwark_upstream/;
    }

    location /_next/ {
        proxy_pass http://$bulwark_upstream/_next/;
    }

    location /branding/ {
        proxy_pass http://$bulwark_upstream/branding/;
    }

    location = /manifest.webmanifest {
        proxy_pass http://$bulwark_upstream/manifest.webmanifest;
    }

    location = /sw.js {
        proxy_pass http://$bulwark_upstream/sw.js;
    }
}
