server_name: ${HERMES_HOSTNAME}
pid_file: /data/homeserver.pid
listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    resources:
      - names: [client, federation]
        compress: false
database:
  name: psycopg2
  args:
    user: ${HERMES_DB_USER}
    password: ${HERMES_DB_PASS}
    database: synapse
    host: hermes-db
    cp_min: 5
    cp_max: 10
media_store_path: /data/media_store
enable_registration: True 
suppress_key_server_warning: True
enable_registration_without_verification: True
registration_shared_secret: ${HERMES_SECRET_CORE}
report_stats: true
macaroon_secret_key: ${HERMES_SECRET_GUEST}
form_secret: ${HERMES_SECRET_FORM}
trusted_key_servers:
  - server_name: "matrix.org"