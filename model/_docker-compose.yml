services:
  hermes_model_redis:
    image: redis:alpine
    container_name: hermes_model_redis
    restart: always
    networks:
      - hermes_net_model_cloud
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    # traefik ignores ports,
    # keep it for k8s/helm charts only. 
    ports:
      - ${HERMES_PORT_PREFIX}17:6379/tcp

  hermes_model_mariadb:
    image: mariadb
    container_name: hermes_model_mariadb
    restart: always
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    networks: 
      - hermes_net_model_cloud
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./data/mariadb:/var/lib/mysql
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_PASSWORD=${HERMES_CLOUD_DB_PASS}
      - MYSQL_DATABASE=${HERMES_CLOUD_DB_NAME}
      - MYSQL_USER=${HERMES_CLOUD_DB_USER}
    # traefik ignores ports,
    # keep it for k8s/helm charts only. 
    ports:
      - ${HERMES_PORT_PREFIX}16:3306/tcp

  hermes_model_postgres:
    image: docker.io/postgres:12-alpine
    container_name: hermes_model_postgres
    networks:
        hermes_net_model_chat:
          ipv4_address: ${HERMES_MODEL_DB_FIXED_IP}
    environment:
      - POSTGRES_USER=${HERMES_CHAT_DB_USER}
      - POSTGRES_PASSWORD=${HERMES_CHAT_DB_PASS}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - ./data/postgres:/var/lib/postgresql/data:default
    # traefik ignores ports,
    # keep it for k8s/helm charts only. 
    ports:
      - ${HERMES_PORT_PREFIX}17:5432/tcp


networks:
  hermes_net_weagle:
    name: hermes_net_weagle
    driver: bridge
    external: true
  hermes_net_model_all:
    name: hermes_net_model_all
    driver: bridge
    external: true
  hermes_net_model_chat:
    name: hermes_net_model_chat
    driver: bridge
    external: true
  hermes_net_model_cloud:
    name: hermes_net_model_cloud
    driver: bridge
    external: true
  # radio:
  #   name: hermes_auth_radio
  #   driver: bridge
  #   external: true