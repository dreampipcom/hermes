networks:
  hermes_net_weagle:
    name: hermes_net_weagle
    driver: bridge
    external: true
  hermes_net_model_all:
    name: hermes_net_model_all
    driver: bridge
    external: true
  hermes_net_model_chat:
    name: hermes_net_model_chat
    driver: bridge
    external: true
  hermes_net_model_cloud:
    name: hermes_net_model_cloud
    driver: bridge
    external: true
